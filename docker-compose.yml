services:

  # ==========================================================
  # Laravel + FrankenPHP
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    ports:
      - "8000:80"

    command: sh -c "php artisan wayfinder:generate --with-form --no-interaction && php artisan octane:frankenphp --host=0.0.0.0 --port=80"

    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_healthy

    networks:
      - laravel


  # ==========================================================
  # Queue Worker
  # ==========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: laravel_queue

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --tries=3
      - --timeout=120

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["NONE"]

    networks:
      - laravel


  # ==========================================================
  # Scheduler
  # ==========================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: laravel_scheduler

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      - php
      - artisan
      - schedule:work

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["NONE"]

    networks:
      - laravel


  # ==========================================================
  # Laravel Reverb
  # ==========================================================
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: laravel_reverb

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      - php
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=8080

    ports:
      - "8080:8080"

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "php", "-r", "$$fp=@fsockopen('localhost',8080,$$e,$$s,2); exit($$fp?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 3

    networks:
      - laravel

  # ==========================================================
  # PostgreSQL
  # ==========================================================
  postgres:
    image: postgres:18-alpine

    container_name: laravel_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - laravel


  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:7-alpine

    container_name: laravel_redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - laravel

  # ==========================================================
  # Vite
  # ==========================================================
  vite:
    image: node:22-alpine

    container_name: laravel_vite

    working_dir: /app

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"

    environment:
      WAYFINDER_GENERATE_COMMAND: "true"

    depends_on:
      app:
        condition: service_started

    networks:
      - laravel

  # ==========================================================
  # MinIO
  # ==========================================================
  minio:
    image: minio/minio:latest

    container_name: laravel_minio

    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-password}

    volumes:
      - minio_data:/data

    ports:
      - "9000:9000"
      - "9001:9001"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - laravel


# ============================================================
# Volumes
# ============================================================

volumes:

  postgres_data:

  redis_data:

  minio_data:

  node_modules:


# ============================================================
# Network
# ============================================================

networks:

  laravel:
    driver: bridge
